files = ["model-00007-of-00007.safetensors", "model_extra_tensors.safetensors", "mtp_draft_vocab_ids.pt", "config.json", "model.safetensors.index.json"]

[models.qwen38-27b-demo-w4a16.serve]   # vllm-patched·vllm-stock 의 vllm serve 인자. HyperQwen single·SPEC=mtp·CTX=long·PREFIX_CACHE=1 이 푼 값과 같게
max_model_len = 150000
gpu_memory_utilization = 0.93
max_num_seqs = 8
max_num_batched_tokens = 2048
kv_cache_dtype = "fp8"
mamba_ssm_cache_dtype = "float16"
spec_method = "mtp"
spec_tokens = 3
prefix_cache = true
cudagraph_max = 32
language_model_only = true
tool_parser = "qwen3_coder"
reasoning_parser = "qwen3"
sse_keep_alive = 30

