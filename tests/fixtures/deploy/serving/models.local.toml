# ---- 차선 계획(eval 인스턴스, pod v7). CF 의 PLAN=<이름> 으로 고른다. 없으면 차선마다 MODEL·ADAPTER 하나(지금처럼) ----
# 차선 k 는 vLLM 127.0.0.1:80k0, 상태 80k1(T20). 카드는 앞 차선부터 차례로 tp 장씩. hyperqwen 어댑터 차선은 차선 0 이어야 한다
# (그 차선만 entrypoint 의 prepare·verify 를 돈다). quality = true 인 차선은 quality_battery 를 돈다(그 밖 차선은 v7 의 smoke).
# env = 계획의 비교 조건(CTX fast|long, SPEC mtp, PREFIX_CACHE 0|1, FAST_VARIANT 0|1). eval 역할만 이것으로 CF 값을 덮는다 — serve 는 PLAN 을 읽지 않는다.
# gpus = 차선 카드 합과 같아야 하고(T25), 인스턴스 장 수와도 같아야 한다(남는 카드 없음 — 다르면 pod 이 HALT).
# fill = true 면 gpus 는 최소 장 수이고, 남는 카드를 마지막 차선과 같은 차선(quality false)으로 tp 장씩 채운다(4장·8장 어디서나).
[plans.cmp-a-b1]
note = "첫 대여: 3090 4장. A 를 두 어댑터로(같은 HyperQwen 이미지·같은 torch) + B1 tp=2. FAST_VARIANT=0 으로 두 A 차선이 같은 무게를 쓴다"
image = "hyperqwen"
gpus = 4
env = { CTX = "long", SPEC = "mtp", PREFIX_CACHE = "1", FAST_VARIANT = "0" }   # 비교 조건은 계획이 갖는다(T21b). CF 에는 PLAN 만
lanes = [
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = true },
  { model = "qwen38-27b-demo-w4a16", adapter = "vllm-patched", quality = true },
  { model = "qwen36-35b-a3b-demo-w4a16", adapter = "vllm-patched", quality = true },
]

[plans.a-x4]
note = "T23: 3090 4장에 모델 A·hyperqwen 를 카드마다 하나씩(지금 E5~E11 기준 조건). v7 eval(PLAN 없음)과 같은 동작 — 품질 점검은 차선 0, 나머지는 짧은 응답 확인"
image = "hyperqwen"
gpus = 4
env = { CTX = "long", SPEC = "mtp", PREFIX_CACHE = "1", FAST_VARIANT = "1" }   # vast/v6 config-day2-main.txt 와 같다(E5~E11)
lanes = [
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = true },
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = false },
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = false },
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = false },
]

[plans.a-all]
note = "T25: 카드마다 A·hyperqwen 한 차선(4장이면 a-x4 와 같다, 8장이면 차선 8). 조건은 a-x4 와 같다. 품질 점검은 차선 0, 나머지는 짧은 응답 확인"
image = "hyperqwen"
gpus = 1
fill = true
env = { CTX = "long", SPEC = "mtp", PREFIX_CACHE = "1", FAST_VARIANT = "1" }   # a-x4 와 같다(E5~E13)
lanes = [
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = true },
]

[plans.cmp-a-b1-x2]
note = "T25: cmp-a-b1 을 8장에 두 벌 — A·hyperqwen 2, A·vllm-patched 2, B1 tp2 2(카드 4·5, 6·7). 품질 점검은 갈래마다 첫 차선만(두 번째는 같은 설정)"
image = "hyperqwen"
gpus = 8
env = { CTX = "long", SPEC = "mtp", PREFIX_CACHE = "1", FAST_VARIANT = "0" }   # cmp-a-b1 과 같다
lanes = [
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = true },
  { model = "qwen38-27b-demo-w4a16", adapter = "hyperqwen-8cf642e", quality = false },
  { model = "qwen38-27b-demo-w4a16", adapter = "vllm-patched", quality = true },
  { model = "qwen38-27b-demo-w4a16", adapter = "vllm-patched", quality = false },
