name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python - "$RUNNER_TEMP/tests.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for i, block in enumerate(re.split(r"\n={70}\n", text)[1:11]):
              head, _, rest = block.partition("\n" + "-" * 70 + "\n")
              tail = [ln for ln in rest.split("\n\n")[0].splitlines() if ln.strip()][-8:]
              msg = head.strip() + "\n" + "\n".join(tail)
              msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              title = head.strip()[:120].replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
              print(f"::error title={title}::{msg[:3000]}")
          PY
